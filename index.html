<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GOOGLE ARAMALARI İÇİN META KODLARI -->
    <title>Benim Web Sitem</title>
    <meta name="description" content="Bu benim kendi kodlarımla tasarladığım ilk canlı web sitem. Projelerimi ve tasarımlarımı burada paylaşıyorum.">
    
    <!-- TASARIM VE RENKLER (CSS) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .kart {
            background-color: #2e2e4a;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4da6ff;
        }
        p {
            color: #d1d1e0;
            line-height: 1.6;
        }
        .buton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4da6ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- EKRANDA GÖRÜNECEK İÇERİK (HTML) -->
    <div class="kart">
        <h1>Hoş Geldiniz!</h1>
        <p>Bu benim internete yüklediğim ilk canlı web sitem. Zamanla buraya yeni tasarımlar ve projeler ekleyeceğim.</p>
        <a href="#" class="buton">Projelerimi Gör</a>
    </div>
<body>

    <div class="kart">
        <!-- BUTONU BURAYA DA KOYABİLİRSİN -->
        <button onclick="selamVer()" class="tikla-buton">Bana Tıkla!</button>

        
        <p>Bu benim ilk canlı web sitem.</p>
    </div>

    <!-- JAVASCRIPT KODU -->
    <script>
        function selamVer() {
            alert("Harika! Zamanın için çok teşekkür ederim.");
        }
    </script>

</body>
</html>
